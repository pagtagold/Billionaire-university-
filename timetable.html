<!DOCTYPE html>
<html>
<head>
  <title>Timetable</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header><h1>Today's Timetable</h1></header>

<div class="container">
  <div class="card">
    <p><strong>Time:</strong> 9:00 – 10:00</p>
    <p><strong>Subject:</strong> Mathematics</p>
    <button onclick="enterClass()">Enter Class</button>
    <p id="msg"></p>
  </div>
</div>

<script>
function enterClass() {
  const hour = new Date().getHours();
  if (hour === 9) {
    localStorage.setItem("attendance", "Present");
    window.location.href = "classroom.html";
  } else {
    document.getElementById("msg").innerText =
      "⏳ Class not active yet. Please wait.";
  }
}
</script>

</body>
</html>
